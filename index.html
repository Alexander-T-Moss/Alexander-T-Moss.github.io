<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Time</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; }
    #currentAlex { font-size: 2rem; margin: 1rem 0; }
    input, button { margin: 0.5rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>Current Alex</h1>
  <div id="currentAlex"></div>

  <h2>Find Your Age in Alex's</h2>
  <input type="date" id="dob">
  <button onclick="calculateDOB()">Calculate</button>
  <div id="dobResult"></div>

  <script>
    const alexStart = new Date("2005-01-22T00:00:00Z");

    function timeToAlexFormat(ms) {
      let seconds = Math.floor(ms / 1000);
      const mins = Math.floor(seconds / 60); seconds %= 60;
      const hours = Math.floor(mins / 60); const minutes = mins % 60;
      const daysTotal = Math.floor(hours / 24); const hrs = hours % 24;
      const years = Math.floor(daysTotal / 365);
      const weeks = Math.floor((daysTotal % 365) / 7);
      const days = (daysTotal % 365) % 7;

      return `${years}:${weeks}:${days}:${hrs}:${minutes}:${seconds}`;
    }

    function updateCurrentAlex() {
      const now = new Date();
      const diff = now - alexStart;
      document.getElementById("currentAlex").textContent = timeToAlexFormat(diff);
    }

    function calculateDOB() {
      const dobInput = document.getElementById("dob").value;
      if (!dobInput) return;
      const dob = new Date(dobInput);
      const diff = dob - alexStart;
      if (diff < 0) {
        document.getElementById("dobResult").textContent = "You were born before 1 Alex!";
      } else {
        document.getElementById("dobResult").textContent = timeToAlexFormat(diff);
      }
    }

    updateCurrentAlex();
    setInterval(updateCurrentAlex, 1000);
  </script>
</body>
</html>
