<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Time</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 2rem; }
    #currentAlex { font-size: 2rem; margin: 1rem 0; }
    input, button { margin: 0.5rem; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>Current Alex</h1>
  <div id="currentAlex"></div>

  <h2>Find Your Age in Alex's</h2>
  <input type="date" id="dob">
  <button onclick="calculateDOB()">Calculate</button>
  <div id="dobResult"></div>

  <script>
    const alexStart = new Date("2005-01-22T00:00:00Z").getTime();
    const msPerYear = 1000 * 60 * 60 * 24 * 365.2425; // avg year length

    function timeToAlexYears(ms) {
      const years = ms / msPerYear;
      return years.toFixed(10);
    }

    function updateCurrentAlex() {
      const now = Date.now();
      const diff = now - alexStart;
      document.getElementById("currentAlex").textContent = timeToAlexYears(diff);
    }

    function calculateDOB() {
      const dobInput = document.getElementById("dob").value;
      if (!dobInput) return;
      const dob = new Date(dobInput).getTime();
      const diff = dob - alexStart;
      document.getElementById("dobResult").textContent = timeToAlexYears(diff);
    }

    // Animation loop with fallback to 60fps if rAF isn't available
    function loop() {
      updateCurrentAlex();
      if (window.requestAnimationFrame) {
        requestAnimationFrame(loop);
      } else {
        setTimeout(loop, 1000 / 60); // fallback ~60fps
      }
    }
    loop();
  </script>
</body>
</html>
