<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Alex Time</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9f9f9;
      color: #222;
      margin: 0;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    h1, h2 { margin-bottom: 0.5rem; font-weight: 600; transition: color 0.3s ease; }
    h1 { font-size: 2.5rem; color: #3b82f6; }
    h2 { font-size: 1.5rem; margin-top: 3rem; color: #444; }

    #currentAlex {
      font-size: 3rem;
      font-weight: 700;
      margin-top: 1rem;
      background: #3b82f6;
      color: #f9f9f9;
      padding: 1rem 2rem;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
      min-width: 14rem;
      user-select: none;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      text-align: center;
    }
    html[data-theme="dark"] #currentAlex {
      background: #60a5fa;
      color: #212121;
      box-shadow: 0 6px 15px rgba(96, 165, 250, 0.6);
    }

    .input-container {
      margin-top: 1rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 320px;
      width: 100%;
    }
    input[type="date"] {
      padding: 0.5rem 0.75rem;
      font-size: 1rem;
      border: 2px solid #3b82f6;
      border-radius: 6px;
      flex-grow: 1;
      min-width: 150px;
      background: white;
      color: #222;
      box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
      transition: border-color 0.3s ease, background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
    }
    input[type="date"]:focus {
      outline: none;
      border-color: #1e40af;
      box-shadow: 0 0 8px 3px #1e40af;
    }

    button {
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.55rem 1.5rem;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.3s ease, color 0.3s ease, box-shadow 0.3s ease;
      flex-shrink: 0;
      min-width: 100px;
      box-shadow: 0 6px 15px rgba(59, 130, 246, 0.3);
    }
    button:hover {
      background-color: #1e40af;
      color: white;
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.7);
    }

    #dobResult {
      margin-top: 1rem;
      font-size: 1.25rem;
      min-height: 1.5em;
      font-weight: 600;
      user-select: none;
      text-align: center;
      color: #444;
      transition: color 0.3s ease;
    }

    /* Dark Theme */
    html[data-theme="dark"] body { background: #212121; color: #ddd; }
    html[data-theme="dark"] h1 { color: #60a5fa; }
    html[data-theme="dark"] h2 { color: #bbb; }
    html[data-theme="dark"] input[type="date"] {
      background: #2a2a2a;
      color: #ddd;
      border-color: #60a5fa;
      box-shadow: 0 6px 15px rgba(96, 165, 250, 0.6);
    }
    html[data-theme="dark"] input[type="date"]:focus {
      border-color: #bfdbfe;
      box-shadow: 0 0 8px 3px #bfdbfe;
    }
    html[data-theme="dark"] button {
      background-color: #60a5fa;
      color: #333;
      box-shadow: 0 6px 15px rgba(96, 165, 250, 0.6);
    }
    html[data-theme="dark"] button:hover {
      background-color: #1e40af;
      color: white;
      box-shadow: 0 8px 20px rgba(30, 64, 175, 0.8);
    }
    html[data-theme="dark"] #dobResult { color: #bbb; }

    /* Theme Toggle */
    #themeToggle {
      position: fixed;
      bottom: 1rem;
      left: 1rem;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(59, 130, 246, 0.4);
      user-select: none;
      min-width: 100px;
      text-align: center;
      z-index: 9999;
      transition: background-color 0.3s ease, color 0.3s ease;
    }
    #themeToggle:hover { background-color: #1e40af; color: white; }
    html[data-theme="dark"] #themeToggle {
      background-color: #60a5fa;
      color: #333;
    }
    html[data-theme="dark"] #themeToggle:hover {
      background-color: #1e40af;
      color: white;
    }

    /* Right buttons */
    #rightButtons {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      z-index: 9999;
    }
    #rightButtons a {
      background-color: #3b82f6;
      color: white;
      border-radius: 6px;
      padding: 0.4rem 0.8rem;
      font-size: 1rem;
      text-decoration: none;
      font-weight: 600;
      min-width: 100px;
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease;
      box-shadow: 0 4px 8px rgba(59, 130, 246, 0.4);
    }
    #rightButtons a:hover { background-color: #1e40af; color: white; }
    html[data-theme="dark"] #rightButtons a { background-color: #60a5fa; color: #333; }
    html[data-theme="dark"] #rightButtons a:hover { background-color: #1e40af; color: white; }

    #confettiCanvas {
      position: fixed;
      pointer-events: none;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9998;
    }

    /* Mobile adjustments */
    @media (max-width: 600px) {
      body { padding: 1rem; }
      h1 { font-size: 1.8rem; }
      h2 { font-size: 1.2rem; margin-top: 2rem; }
      #currentAlex { font-size: 2rem; padding: 0.8rem 1rem; min-width: auto; }
      button, input[type="date"] { font-size: 0.9rem; padding: 0.4rem 1rem; }
      #dobResult { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <h1>Current Alex</h1>
  <div id="currentAlex">Loading...</div>

  <h2>Find Your Age in Alex's</h2>
  <div class="input-container">
    <input type="date" id="dob" aria-label="Date of Birth" />
    <button onclick="calculateDOB()">Calculate</button>
  </div>
  <div id="dobResult" aria-live="polite"></div>

  <button id="themeToggle" aria-label="Toggle Light/Dark Mode">Dark Mode</button>

  <div id="rightButtons">
    <a href="https://en.wikipedia.org/wiki/Vibe_coding" target="_blaxnk">Vibe Coded</a>
    <a href="https://github.com/Alexander-T-Moss/Alexander-T-Moss.github.io" target="_blank">V1.0</a>
  </div>

  <canvas id="confettiCanvas"></canvas>

  <script>
    const alexStart = new Date("2005-01-22T00:00:00Z").getTime();

    function msToYears(ms) {
      const msPerYear = 1000 * 60 * 60 * 24 * 365.2425;
      return ms / msPerYear;
    }

    function getDecimals() {
      return 10;
    }

    function updateCurrentAlex() {
      const now = Date.now();
      const diff = now - alexStart;
      const years = msToYears(diff);
      document.getElementById("currentAlex").textContent = years.toFixed(getDecimals());
    }

    function calculateDOB() {
      const dobInput = document.getElementById("dob").value;
      if (!dobInput) return;

      const dobResult = document.getElementById("dobResult");

      if (dobInput === "2005-01-22") {
        dobResult.textContent = "🎉 That's My Birthdate! 🎉";
        startConfetti();
      } else {
        dobResult.textContent = "";
      }

      const dobTime = new Date(dobInput).getTime();
      const now = Date.now();

      const numerator = now - dobTime;
      const denominator = now - alexStart;

      if (denominator <= 0) {
        dobResult.textContent = "Alex start date is in the future!";
        return;
      }

      const alexAge = numerator / denominator;

      if (alexAge < 0) {
        dobResult.textContent = "The date entered is in the future!";
      } else if (dobInput !== "2005-01-22") {
        dobResult.textContent = `Age In Alex Years: ${alexAge.toFixed(getDecimals())}`;
      }
    }

    function loop() {
      updateCurrentAlex();
      requestAnimationFrame(loop);
    }
    loop();

    const themeToggle = document.getElementById("themeToggle");

    function setTheme(theme, save = true) {
      if (theme === "dark") {
        document.documentElement.setAttribute("data-theme", "dark");
        themeToggle.textContent = "Light Mode";
      } else {
        document.documentElement.removeAttribute("data-theme");
        themeToggle.textContent = "Dark Mode";
      }
      if (save) {
        sessionStorage.setItem("theme", theme);
      }
    }

    function clearThemeOverride() {
      sessionStorage.removeItem("theme");
    }

    function syncThemeWithSystem() {
      if (!sessionStorage.getItem("theme")) {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");
        setTheme(prefersDark.matches ? "dark" : "light", false);
      }
    }

    const prefersDarkMediaQuery = window.matchMedia("(prefers-color-scheme: dark)");
    prefersDarkMediaQuery.addEventListener("change", e => {
      syncThemeWithSystem();
    });

    themeToggle.addEventListener("click", () => {
      const currentTheme = document.documentElement.getAttribute("data-theme");
      if (sessionStorage.getItem("theme")) {
        clearThemeOverride();
        syncThemeWithSystem();
      } else {
        if (currentTheme === "dark") {
          setTheme("light");
        } else {
          setTheme("dark");
        }
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      const savedTheme = sessionStorage.getItem("theme");
      if (savedTheme) {
        setTheme(savedTheme, false);
      } else {
        syncThemeWithSystem();
      }
    });

    const confettiCanvas = document.getElementById("confettiCanvas");
    const ctx = confettiCanvas.getContext("2d");
    let confettiPieces = [];
    let confettiAnimation;

    function resizeCanvas() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    class ConfettiPiece {
      constructor() {
        this.x = Math.random() * confettiCanvas.width;
        this.y = Math.random() * confettiCanvas.height - confettiCanvas.height;
        this.size = 5 + Math.random() * 5;
        this.speedY = 1 + Math.random() * 3;
        this.color = `hsl(${Math.random() * 360}, 70%, 60%)`;
        this.tilt = Math.random() * 10 - 5;
        this.tiltSpeed = Math.random() * 0.1 + 0.05;
      }
      update() {
        this.y += this.speedY;
        this.tilt += this.tiltSpeed;
        if (this.y > confettiCanvas.height) {
          this.y = -this.size;
          this.x = Math.random() * confettiCanvas.width;
        }
      }
      draw() {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.moveTo(this.x + this.tilt, this.y);
        ctx.lineTo(this.x + this.tilt + this.size, this.y);
        ctx.lineTo(this.x + this.tilt + this.size / 2, this.y + this.size);
        ctx.closePath();
        ctx.fill();
      }
    }

    function startConfetti() {
      confettiPieces = [];
      for (let i = 0; i < 150; i++) {
        confettiPieces.push(new ConfettiPiece());
      }
      if (!confettiAnimation) {
        confettiAnimation = requestAnimationFrame(confettiLoop);
      }
      setTimeout(stopConfetti, 5000);
    }

    function stopConfetti() {
      if (confettiAnimation) {
        cancelAnimationFrame(confettiAnimation);
        confettiAnimation = null;
      }
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    }

    function confettiLoop() {
      ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      confettiPieces.forEach(piece => {
        piece.update();
        piece.draw();
      });
      confettiAnimation = requestAnimationFrame(confettiLoop);
    }
  </script>
</body>
</html>
