<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alex Time</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    #alexValue {
      font-size: 2em;
      margin: 20px 0;
    }
    input {
      padding: 8px;
      font-size: 1em;
    }
    button {
      padding: 8px 12px;
      font-size: 1em;
      margin-left: 8px;
    }
    #result {
      margin-top: 15px;
      font-weight: bold;
      font-size: 1.2em;
    }
  </style>
</head>
<body>
  <h1>Welcome to Alex Time</h1>
  <div id="alexValue"></div>

  <h2>Find your age in Alexes</h2>
  <input type="date" id="dob">
  <button onclick="startLiveAge()">Calculate</button>
  <div id="result"></div>

  <script>
    const alexStart = new Date('2005-01-22T00:00:00Z');
    let dob = null; // Will hold the user's date of birth

    function getCurrentAlexParts() {
      const now = new Date();
      let diffMs = now - alexStart;

      const sec = 1000;
      const min = sec * 60;
      const hr = min * 60;
      const day = hr * 24;
      const year = day * 365.25; // average year length including leap years

      const years = Math.floor(diffMs / year);
      diffMs -= years * year;

      const days = Math.floor(diffMs / day);
      diffMs -= days * day;

      const hours = Math.floor(diffMs / hr);
      diffMs -= hours * hr;

      const minutes = Math.floor(diffMs / min);
      diffMs -= minutes * min;

      const seconds = Math.floor(diffMs / sec);

      return { years, days, hours, minutes, seconds };
    }

    function updateAlex() {
      const { years, days, hours, minutes, seconds } = getCurrentAlexParts();
      document.getElementById('alexValue').innerText = 
        `Current Alex: ${years}:${days}:${hours}:${minutes}:${seconds}`;
    }

    function updateAge() {
      if (!dob) return;
      const now = new Date();
      const ageMs = now - dob;
      const alexMs = now - alexStart;
      const ageInAlexes = ageMs / alexMs;
      document.getElementById('result').innerText = 
        `Your age is ${ageInAlexes.toFixed(6)} Alexes`;
    }

    function startLiveAge() {
      const dobInput = document.getElementById('dob').value;
      if (!dobInput) return;
      dob = new Date(dobInput);
      updateAge(); // Initial calculation
    }

    // Update every second
    setInterval(() => {
      updateAlex();
      updateAge();
    }, 1000);

    // Initial display
    updateAlex();
  </script>
</body>
</html>
